services:
  db:
    image: postgres:16-alpine
    container_name: flatcheck-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: flatrate
      POSTGRES_PASSWORD: flatrate_password
      POSTGRES_DB: flatcheck
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "54713:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flatrate"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flatcheck-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://flatrate:flatrate_password@db:5432/flatcheck
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change-this-in-production}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  uploads:
