name: Semgrep

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  semgrep:
    name: Static Analysis (Semgrep)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/typescript
            p/nodejs
            p/owasp-top-ten
